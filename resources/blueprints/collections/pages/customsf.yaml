title: CustomSF
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
          -
            handle: logoimage
            field:
              container: s3_assets
              folder: /
              type: assets
              display: LogoImage
              listable: true
          -
            handle: donorbox
            field:
              type: html
              display: DonorBox
      -
        display: HeroVideo
        fields:
          -
            handle: herovideo
            field:
              container: assets
              type: assets
              display: HeroVideo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
