title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              display: Content
              localizable: true
      -
        display: 'Inside Hero'
        fields:
          -
            handle: turn_off_hero
            field:
              type: toggle
              display: 'Turn Off Hero'
          -
            handle: eyebrow
            field:
              type: text
              display: Eyebrow
              unless:
                turn_off_hero: 'equals true'
              always_save: true
              width: 50
          -
            handle: inside_hero_header
            field:
              type: text
              display: 'Inside Hero Header'
              unless:
                turn_off_hero: 'equals true'
              always_save: true
              width: 50
          -
            handle: inside_hero_content
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Inside Hero Content'
              unless:
                turn_off_hero: 'equals true'
              always_save: true
          -
            handle: inside_hero_button_text
            field:
              type: text
              display: 'Inside Hero Button Text'
              always_save: true
              unless:
                turn_off_hero: 'equals true'
              width: 50
          -
            handle: inside_hero_button_link
            field:
              type: text
              display: 'Inside Hero Button Link'
              always_save: true
              unless:
                turn_off_hero: 'equals true'
              width: 50
          -
            handle: inside_hero_button_text_2
            field:
              type: text
              display: 'Inside Hero Button Text 2'
              always_save: true
              unless:
                turn_off_hero: 'equals true'
              width: 50
          -
            handle: inside_hero_button_link_2
            field:
              type: text
              display: 'Inside Hero Button Link 2'
              always_save: true
              unless:
                turn_off_hero: 'equals true'
              width: 50
          -
            handle: inside_hero_button_text_3
            field:
              type: text
              display: 'Inside Hero Button Text 3'
              always_save: true
              unless:
                turn_off_hero: 'equals true'
              width: 50
          -
            handle: inside_hero_button_link_3
            field:
              type: text
              display: 'Inside Hero Button Link 3'
              always_save: true
              unless:
                turn_off_hero: 'equals true'
              width: 50
          -
            handle: open_in_new_tab
            field:
              type: toggle
              display: 'Open in new tab'
          -
            handle: inside_hero_image
            field:
              max_files: 1
              container: s3_assets
              type: assets
              display: 'Inside Hero Image'
              unless:
                turn_off_hero: 'equals true'
              always_save: true
      -
        display: 'Page Builder'
        fields:
          -
            import: page_builder
          -
            import: people_grid
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: template
            field:
              type: template
              display: Template
              localizable: true
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              localizable: true
              max_items: 1
