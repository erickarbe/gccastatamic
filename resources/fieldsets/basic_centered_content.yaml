title: 'Basic Centered Content'
fields:
  -
    handle: background_color
    field:
      swatches:
        - '#263340'
        - '#ff172e'
        - '#f6f3f4'
        - 565d6f
        - fffff0
        - d9dbdb
      default: '#ffffff'
      type: color
      display: 'Background Color'
  -
    handle: eyebrow
    field:
      type: text
      display: Eyebrow
  -
    handle: heading
    field:
      type: text
      display: Heading
  -
    handle: content
    field:
      remove_empty_nodes: false
      type: bard
      display: Content
      container: s3_assets
      buttons:
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - removeformat
        - quote
        - anchor
        - image
        - table
        - h4
        - h5
        - h6
        - underline
        - horizontalrule
        - alignleft
        - aligncenter
        - alignright
      smart_typography: true
  -
    handle: button_text
    field:
      type: text
      display: 'Button Text'
      width: 50
  -
    handle: button_link
    field:
      type: link
      display: 'Button Link'
      width: 50
  -
    handle: open_in_new_tab
    field:
      type: toggle
      display: 'Open in new tab'
